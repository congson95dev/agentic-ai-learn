[project]
name = "agentic-a2a-system"
version = "0.1.0"
description = "Monorepo học giao tiếp multi-agent bằng A2A"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[fastapi]==1.3.0",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["agents*", "services*", "shared*"]

